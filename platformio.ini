; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; FreeRTOS + bare-metal C++11 for the Arduino MKR1000 (ATSAMD21G18A) - no Arduino framework.
;   src/startup.cpp            vector table and reset handler
;   ld/samd21g18a_app.ld       memory layout (app starts after the 8 KB bootloader)
;   include/FreeRTOSConfig.h   kernel configuration
;   lib/FreeRTOS-Kernel        official kernel V11.3.1 (library.json selects the ARM_CM0 port)

[platformio]
default_envs = mkr1000

[env:mkr1000]
platform = atmelsam
board = mkr1000USB
; No "framework" line: nothing but CMSIS register headers, FreeRTOS and our own code.
platform_packages =
    platformio/framework-cmsis
    platformio/framework-cmsis-atmel

board_build.ldscript = ld/samd21g18a_app.ld
extra_scripts = pre:scripts/cxx_standard.py

; Strict ISO C++11 for C++ sources (added to CXXFLAGS by scripts/cxx_standard.py)
build_unflags = -std=gnu++11
build_flags =
    -D__SAMD21G18A__
    -isystem "${platformio.packages_dir}/framework-cmsis/CMSIS/Include"
    -isystem "${platformio.packages_dir}/framework-cmsis-atmel/CMSIS/Device/ATMEL"
    -I include
    -I lib/FreeRTOS-Kernel/portable/GCC/ARM_CM0
    -Wl,-Map,${BUILD_DIR}/firmware.map
build_src_flags =
    -Wall
    -Wextra

; This firmware has no USB stack, so the board can't be reset into the
; bootloader over USB. Before uploading, double-tap the reset button: the LED
; pulses and the SAM-BA bootloader appears as its own COM port (USB 2341:004E).
upload_port = COM7
